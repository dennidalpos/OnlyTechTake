name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read


  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Verify Full
        run: >-
          ./gradlew --no-configuration-cache
          :app:lintFullDebug
          :app:compileFullDebugKotlin
          :app:testFullDebugUnitTest

      - name: Verify Demo
        run: >-
          ./gradlew --no-configuration-cache
          :app:compileDemoDebugKotlin
          :app:testDemoDebugUnitTest

      - name: Verify Showcase
        run: >-
          ./gradlew --no-configuration-cache
          :app:compileShowcaseDebugKotlin
          :app:testShowcaseDebugUnitTest
