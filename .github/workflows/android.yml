name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Verify Full
        run: >-
          ./gradlew --no-configuration-cache
          :app:lintFullDebug
          :app:compileFullDebugKotlin
          :app:testFullDebugUnitTest

      - name: Verify Demo
        run: >-
          ./gradlew --no-configuration-cache
          :app:compileDemoDebugKotlin
          :app:testDemoDebugUnitTest

      - name: Verify Showcase
        run: >-
          ./gradlew --no-configuration-cache
          :app:compileShowcaseDebugKotlin
          :app:testShowcaseDebugUnitTest
