<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004F4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006A6A;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#grad1)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Logo and Branding -->
  <g transform="translate(100, 150)">
    <!-- Icon -->
    <path d="M0 40L64.9519 0V80L0 120L-64.9519 80V0L0 40Z" fill="#6FF6F6" transform="translate(65, 0)"/>
    <path d="M45 35H75V45H65V85H55V45H45V35Z" fill="#004F4F" transform="translate(35, 10)"/>

    <!-- Text -->
    <text x="160" y="60" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="white">OnlyTechTake</text>
    <text x="160" y="115" font-family="Arial, sans-serif" font-size="32" font-style="italic" fill="#6FF6F6">Un&apos;app per ogni problema!</text>
    <rect x="160" y="135" width="600" height="6" rx="3" fill="#FFBA28"/>
  </g>

  <!-- Showcase Elements (Stylized App Screen placeholders) -->
  <g transform="translate(850, 320) rotate(-10)">
    <rect x="0" y="0" width="280" height="500" rx="40" fill="#191C1D" stroke="white" stroke-width="8"/>
    <rect x="20" y="60" width="240" height="40" rx="8" fill="#3F4948"/>
    <rect x="20" y="120" width="240" height="150" rx="16" fill="#006A6A"/>
    <rect x="20" y="290" width="100" height="30" rx="8" fill="#FFBA28"/>
    <rect x="130" y="290" width="130" height="30" rx="8" fill="#6FF6F6"/>
  </g>

  <g transform="translate(700, 380) rotate(5)">
    <rect x="0" y="0" width="280" height="500" rx="40" fill="#F4FBFA" stroke="#191C1D" stroke-width="8"/>
    <rect x="20" y="60" width="240" height="300" rx="16" fill="#DAE5E4"/>
    <circle cx="140" cy="450" r="20" fill="#006A6A"/>
  </g>
</svg>
